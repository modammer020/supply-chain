# Component catalog (demo catalog, deterministic generated data)
# Part-number formula: PART-{KIND}-{SEQ} · SEQ = sequence per type.
# Used by the recommendation engine (FR-104) and vehicle dossiers (FR-105).
# Labels: all prices/lead times are DEMO values (source: SIM catalog).

catalog:
  part_number_format: "PART-{kind}-{seq:03d}"
  currency: EUR
  disclaimer: "Demo catalog: specifications, prices and lead times are generated sample data."

